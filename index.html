        async function injectHTMLInIframe(base64Data, fallbackUrl) {
            try {
                const cleanData = base64Data.replace(/\s/g, '');
                const binaryData = atob(cleanData);
                const bytes = new Uint8Array(binaryData.length);
                for (let i = 0; i < binaryData.length; i++) bytes[i] = binaryData.charCodeAt(i);
                const stream = new Blob([bytes]).stream();
                const decompressedStream = stream.pipeThrough(new DecompressionStream('gzip'));
                const originalHTML = await new Response(decompressedStream).text();
                const frame = document.getElementById('dawnFrame');
                frame.srcdoc = originalHTML;
                document.getElementById('status').innerText = "System Status: Online (Compressed) ✅";
            } catch (e) {
                console.warn("Compressed boot failed, switching to Fallback...", e);
                document.getElementById('status').innerText = "System Warning: تحويل لنظام الطوارئ الاحتياطي ⚠️";
                try {
                    const response = await fetch(fallbackUrl);
                    if (!response.ok) throw new Error('فشل تحميل الملف الاحتياطي أيضاً');
                    const fallbackHTML = await response.text();
                    const frame = document.getElementById('dawnFrame');
                    frame.srcdoc = fallbackHTML;
                    document.getElementById('status').innerText = "System Status: Online (Fallback Mode) 🔄";
                } catch (fallbackErr) {
                    document.getElementById('status').innerText = "System Panic: عطل تام ولم نتمكن من الإنقاذ ❌";
                    console.error("Critical Kernel Error:", fallbackErr);
                }
            }
        }
